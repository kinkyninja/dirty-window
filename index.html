<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dirty Window</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Стиль онбординга Анны: бумага, чернила, Unbounded + Inter */
    @font-face { font-family: 'Unbounded'; font-weight: 700; font-display: swap; src: url('/fonts/unbounded-v12-cyrillic_latin-700.woff2') format('woff2'); }
    @font-face { font-family: 'Unbounded'; font-weight: 800; font-display: swap; src: url('/fonts/unbounded-v12-cyrillic_latin-800.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-weight: 400; font-display: swap; src: url('/fonts/inter-v20-cyrillic_latin-regular.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-weight: 500; font-display: swap; src: url('/fonts/inter-v20-cyrillic_latin-500.woff2') format('woff2'); }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      background-color: #f2ede4;
      color: #1e1b26;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      overscroll-behavior: none;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #root {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
    }
    canvas {
      touch-action: none;
      display: block;
      overscroll-behavior: none;
    }
    /* Слои стекла задаём обычным CSS: Tailwind с CDN применяется не сразу,
       а холст в потоке растягивал бы стекло под свой размер */
    .glass-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .cursor-brush {
      pointer-events: none;
      position: fixed;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 9999;
      transition: width 0.15s cubic-bezier(0.23, 1, 0.32, 1), height 0.15s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.3s;
    }
    @media (pointer: coarse) {
      .cursor-brush {
        display: none;
      }
    }

    @keyframes sparkle-pop {
      0% {
        transform: scale(0) rotate(-20deg);
        opacity: 0;
      }
      70% {
        transform: scale(1.3) rotate(10deg);
      }
      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }
    .animate-sparkle {
      animation: sparkle-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }


    .hud-series {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 0;
      font: 700 15px/1.2 'Unbounded', sans-serif;
      letter-spacing: -0.01em;
    }
    .hud-count {
      font: 500 13px/1 'Inter', sans-serif;
      color: #5f5a66;
    }
    .start-title {
      font: 800 22px/1.15 'Unbounded', sans-serif;
      letter-spacing: -0.02em;
    }
    .start-btn, .next-btn {
      font: 700 16px/1 'Unbounded', sans-serif;
    }

    /* Подсказка сама появляется и гаснет за 2.8 с */
    @keyframes toast-life {
      0% {
        transform: translateY(8px);
        opacity: 0;
      }
      12% {
        transform: none;
        opacity: 1;
      }
      85% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }
    .animate-toast {
      animation: toast-life 2.8s ease-out both;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="index.tsx"></script>
</body>
</html>
